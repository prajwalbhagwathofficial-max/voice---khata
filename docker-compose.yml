services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VOICE_KHATA_HOST: "0.0.0.0"
      VOICE_KHATA_PORT: "8000"
      VOICE_KHATA_DB_PATH: "/data/voice_khata.db"
      LEDGER_DB_PATH: "/data/ledger.db"
    volumes:
      - khata_data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: "${VOICE_KHATA_DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  khata_data:
  caddy_data:
  caddy_config:
